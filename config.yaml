camera:
  index: 0
  width: 640
  height: 480
  fps: 30
  fov_h: 60
  fov_v: 45

detector:
  type: haar          # haar | synthetic
  confidence: 0.5

tracking:
  filter_alpha: 0.25
  deadband: 0.05
  target_timeout_ms: 300

uart:
  port: /dev/ttyACM0
  baudrate: 115200
  timeout: 0.1

pan:
  kp: 1.15
  ki: 0.0
  kd: 0.08
  max_speed: 70
  acceleration: 220
  deadband: 0.04

tilt:
  kp: 1.05
  ki: 0.0
  kd: 0.10
  max_speed: 50
  acceleration: 180
  deadband: 0.04

motor:
  steps_per_revolution: 400
  microstepping: 16
  pan_limit_deg: 85
  tilt_limit_deg: 40
